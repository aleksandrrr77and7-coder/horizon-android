plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'dev.horizon.android'
    compileSdk 35
    defaultConfig {
        applicationId providers.gradleProperty('appId').getOrElse('dev.horizon.android')
        minSdk providers.gradleProperty('minSdk').getOrElse('28').toInteger()
        targetSdk 35
        versionCode providers.gradleProperty('devVersionCode').getOrElse('1014').toInteger()
        versionName '1.0'
        ndk { abiFilters providers.gradleProperty('abi').getOrElse('arm64-v8a') }
    }
    signingConfigs {
        development {
            storeFile file('../../.local/android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Release signing parameters must come from environment or Gradle properties.
            // Never store passwords or keys in source code.
            def ksFile = providers.gradleProperty('releaseKeystoreFile').orNull
                    ?: System.env.RELEASE_KEYSTORE_FILE
                    ?: file('../../.local/android/release.keystore')
            def ksPassword = providers.gradleProperty('releaseKeystorePassword').orNull
                    ?: System.env.RELEASE_KEYSTORE_PASSWORD
            def keyAlias = providers.gradleProperty('releaseKeyAlias').orNull
                    ?: System.env.RELEASE_KEY_ALIAS
            def keyPassword = providers.gradleProperty('releaseKeyPassword').orNull
                    ?: System.env.RELEASE_KEY_PASSWORD

            if (ksFile == null || ksPassword == null || keyAlias == null || keyPassword == null) {
                throw new InvalidUserDataException(
                    'Release signing requires releaseKeystoreFile, releaseKeystorePassword, ' +
                    'releaseKeyAlias and releaseKeyPassword (via Gradle properties or environment variables).')
            }

            storeFile file(ksFile)
            storePassword ksPassword
            keyAlias keyAlias
            keyPassword keyPassword
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.development
            versionNameSuffix '-dev.' + providers.gradleProperty('devBuild').getOrElse('local')
            if (!providers.gradleProperty('appId').isPresent()) { applicationIdSuffix '.dev' }
        }
        release {
            debuggable false
            jniDebuggable false
            minifyEnabled false
            // Retain the existing installation's signing identity for upgrades.
            // Only the public certificate enters the APK; the key stays in .local/.
            signingConfig signingConfigs.release
        }
    }
    sourceSets.main {
        java.srcDirs = ['java']
        manifest.srcFile 'AndroidManifest.xml'
        jniLibs.srcDirs = ['../../.local/android/gradle-jni']
        assets.srcDirs = ['../../.local/android/gradle-assets']
        res.srcDirs = ['res']
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += '**/*.so' } }
    buildDirectory = file('../../.local/android/gradle-build')
}
