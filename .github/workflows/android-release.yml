name: Android release APKs
run-name: Android release · ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Release version code (overrides RELEASE_VERSION_CODE secret)
        type: string
        required: false
      all_abis:
        description: Build all four ABIs (armeabi-v7a, arm64-v8a, x86, x86_64)
        type: boolean
        default: true

permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Release builds only on the android branch, never on PRs or forks.
    if: github.ref == 'refs/heads/android'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.all_abis && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || '["arm64-v8a"]') }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
      HORIZON_TELEMETRY_URL: 'off'
      # Release signing parameters from GitHub Secrets.
      # Decoded in the "Prepare release keystore" step.
      RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/.local/android/release.keystore
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Validate release secrets
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE }}" ]; then
            echo "::error::RELEASE_KEYSTORE secret is not configured. Set it to a base64-encoded release keystore."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" ]; then
            echo "::error::RELEASE_KEYSTORE_PASSWORD secret is not configured."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEY_ALIAS }}" ]; then
            echo "::error::RELEASE_KEY_ALIAS secret is not configured."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "::error::RELEASE_KEY_PASSWORD secret is not configured."
            exit 1
          fi
          if [ -z "${{ secrets.RELEASE_VERSION_CODE }}" ] && [ -z "${{ inputs.version_code }}" ]; then
            echo "::error::RELEASE_VERSION_CODE secret or version_code input is required."
            exit 1
          fi
      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          mkdir -p .local/android
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > .local/android/release.keystore
          chmod 600 .local/android/release.keystore
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.14'
      - name: Install Android toolchain
        env:
          ABI: ${{ matrix.abi }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: android-release-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            android-release-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Build optimized public release APK
        env:
          ABI: ${{ matrix.abi }}
          VERSION_CODE: ${{ inputs.version_code || secrets.RELEASE_VERSION_CODE || '1014' }}
        run: |
          python3 tools/android_build.py --abi "$ABI" --public --profile release \
            --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --gradle "$(command -v gradle)" \
            --ndk-version 28.2.13676358 --build-tools-version 35.0.0
      - name: Verify APK signature
        env:
          ABI: ${{ matrix.abi }}
          TOOLS_DIR: ${{ env.ANDROID_HOME }}/build-tools/35.0.0
        run: |
          apk=".local/android/apk/${ABI}/horizon-android-public.apk"
          "${JAVA_HOME}/bin/java" -jar "$TOOLS_DIR/lib/apksigner.jar" verify --verbose "$apk"
      - name: Verify package ID, version, ABI
        env:
          ABI: ${{ matrix.abi }}
          VERSION_CODE: ${{ inputs.version_code || secrets.RELEASE_VERSION_CODE || '1014' }}
        run: |
          apk=".local/android/apk/${ABI}/horizon-android-public.apk"
          echo "=== Package info ==="
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "^package:|application-label:|native-code:"
          echo ""
          echo "=== Expected checks ==="
          echo "Expected package: dev.horizon.android"
          echo "Expected versionName: 1.0"
          echo "Expected versionCode: $VERSION_CODE"
          echo "Expected ABI: $ABI"
          echo ""
          "${ANDROID_HOME}/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "^package: name='dev.horizon.android' versionCode='$VERSION_CODE' versionName='1.0'" || {
            echo "::error::Package ID, versionCode or versionName mismatch!"
            exit 1
          }
      - name: Collect release APK and metadata
        env:
          ABI: ${{ matrix.abi }}
          VERSION_CODE: ${{ inputs.version_code || secrets.RELEASE_VERSION_CODE || '1014' }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          out = Path('dist')
          out.mkdir()
          sha = os.environ['GITHUB_SHA']
          abi = os.environ['ABI']
          name = f'Voxelix 1.0-{abi}.apk' if abi != 'arm64-v8a' else 'Voxelix 1.0.apk'
          apk = out / name
          shutil.copyfile(Path('.local/android/apk') / abi / 'horizon-android-public.apk', apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(f'{digest}  {name}\n')
          for source, dest in [('LICENSE', 'LICENSE.txt'), ('THIRD_PARTY_NOTICES.md', 'THIRD_PARTY_NOTICES.md')]:
              shutil.copyfile(source, out / dest)
          (out / 'BUILD.json').write_text(json.dumps({'commit': sha, 'abi': abi, 'profile': 'release',
              'package': 'dev.horizon.android', 'version_name': '1.0', 'version_code': int(os.environ['VERSION_CODE']),
              'experimental': False,
              'run': f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'}, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### Release APK: {abi}\n\nCommit: `{sha}`. Signed release build, version 1.0.\n\n'
                  f'SHA-256: `{digest}`\n\n'
                  'Download the APK artifact below.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: horizon-release-${{ github.run_number }}-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Remove release keystore
        if: always()
        run: rm -f .local/android/release.keystore
