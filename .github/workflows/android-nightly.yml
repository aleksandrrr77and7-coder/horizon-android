# Android nightly build
# Runs on a schedule to catch regressions in toolchain, dependencies, and Rust sources.
# Builds all four Android ABIs and runs actionlint + Python tests on every nightly run.
name: Android nightly
on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      abi:
        description: "ABI to build (default: arm64-v8a only)"
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86, x86_64]
        default: arm64-v8a
      full:
        description: Build all four ABIs instead of just arm64-v8a
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-nightly
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: git diff --check
      - run: python3 tools/check_public_tree.py --history
      - run: python3 -m unittest discover -s tests -p 'test_android*.py'
      - run: python3 tools/test_android_diagnostics.py
      - run: python3 tools/test_android_performance.py
      - run: python3 tools/test_android_content.py
      - run: python3 tools/test_android_session.py
      - run: python3 tools/test_android_hotplug.py
      - run: python3 tools/test_android_appearance.py
      - uses: dtolnay/rust-toolchain@1
        with:
          toolchain: '1.95.0'
      - name: Run Android GPU tests (best-effort, requires GPU adapter)
        run: python3 tools/test_android_gpu.py || true
      - name: Check workflow export matches the active workflow
        run: |
          cmp .github/workflows/android-source.yml packaging/android/source-checks.yml
          cmp .github/workflows/android-dev.yml packaging/android/dev-builds.yml
      - name: Lint GitHub Actions workflows with actionlint
        working-directory: ./tools/actionlint-check
        run: go run . ../../.github/workflows/android-source.yml ../../.github/workflows/android-dev.yml
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.full || github.event_name == 'schedule'
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.full && '["arm64-v8a","armeabi-v7a","x86","x86_64"]' || fromJSON('["arm64-v8a"]')) }}
    env:
      HORIZON_TELEMETRY_URL: 'off'
      CARGO_BUILD_JOBS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/ci-target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Android toolchain
        env:
          ABI: ${{ matrix.abi }}
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup show
          case "$ABI" in
            arm64-v8a) target=aarch64-linux-android ;;
            armeabi-v7a) target=armv7-linux-androideabi ;;
            x86) target=i686-linux-android ;;
            x86_64) target=x86_64-linux-android ;;
          esac
          rustup target add "$target"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .local/ci-target
          key: android-nightly-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-${{ github.sha }}
          restore-keys: |
            android-nightly-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'packaging/android/build.gradle') }}-
      - name: Check public source and packaging boundaries
        run: |
          python3 tools/check_public_tree.py
          python3 -m unittest discover -s tests -p 'test_android_release_audit.py'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare private engine inputs from official downloads
        run: python3 tools/android_prepare.py --java-home "$JAVA_HOME"
      - name: Check Android Rust code without building an APK
        run: python3 tools/android_build.py --abi "${{ matrix.abi }}" --check --public --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME" --ndk-version 28.2.13676358 --build-tools-version 35.0.0
